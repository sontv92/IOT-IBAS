<div [config]="{backdrop: 'static',  keyboard: false}" bsModal #CateNewsModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-big" role="document" style="max-width:1300px">
    <form class="login-form">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title" *ngIf="Item.CategoryId==undefined">Thêm mới danh mục tin</h4>
          <h4 class="modal-title" *ngIf="Item.CategoryId!=undefined">Sửa thông tin danh mục tin</h4>
          <button type="button" class="close" (click)="CateNewsModal.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="">
            <div class="card-body body-form-add-new">
              <div class="row">
                <div class="col-sm-12 col-md-9">
                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="Code">Mã danh mục<span *ngIf="Item.Code==undefined || Item.Code==''" style="color: red;">&ngsp;(*)</span></label>
                      <div class="col-md-12">
                        <input type="text" id="Code" name="Code" class="form-control" placeholder="" [(ngModel)]="Item.Code" autocomplete="off">
                      </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="Name">Tên danh mục<span *ngIf="Item.Name==undefined || Item.Name==''" style="color: red;">&ngsp;(*)</span></label>
                      <div class="col-md-12">
                        <input type="text" id="Name" name="Name" class="form-control" placeholder="" [(ngModel)]="Item.Name" (ngModelChange)="ChangeTitle(1)" autocomplete="off">
                      </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="Url">Đường dẫn<span *ngIf="Item.Url==undefined || Item.Url==''" style="color: red;">&ngsp;(*)</span></label>
                      <div class="col-md-12">
                        <input type="text" id="Url" name="Url" class="form-control" placeholder="" [(ngModel)]="Item.Url" autocomplete="off">
                      </div>
                    </div>

                  </div>



                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row custom-ckeditor">
                      <label class="col-form-label col-sm-12 col-md-12">Nội dung</label>
                      <div class="col-sm-12 col-md-12">
                        <ckeditor name="myckeditor"
                                  required
                                  [(ngModel)]="Item.Contents"
                                  [config]=""
                                  [readonly]="false"
                                  debounce="500">
                        </ckeditor>
                      </div>
                    </div>
                  </div>
                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="Description">Mô tả(<i>{{newDescription.value.length}}/300</i>)</label>
                      <div class="col-md-12">
                        <textarea id="Description" name="Description" maxlength="300" rows="3" class="form-control" placeholder="" [(ngModel)]="Item.Description" (ngModelChange)="ChangeTitle(2)" #newDescription></textarea>
                        
                      </div>
                    </div>
                    </div>

                    <div class="col-sm-12 col-md-12">
                      <div class="form-group row">
                        <label class="col-md-12 col-form-label" for="MetaTitle">Meta Title(<i>{{newMetaTitle.value.length}}/200</i>)</label>
                        <div class="col-md-12">
                          <textarea id="MetaTitle" name="MetaTitle" maxlength="200" rows="3" class="form-control" placeholder="" [(ngModel)]="Item.MetaTitle" #newMetaTitle></textarea>
                          
                        </div>
                      </div>
                    </div>
                    <div class="col-sm-12 col-md-12">
                      <div class="form-group row">
                        <label class="col-md-12 col-form-label" for="MetaKeyword">Meta Keyword(<i>{{newMetaKeyword.value.length}}/200</i>)</label>
                        <div class="col-md-12">
                          <textarea id="MetaKeyword" name="MetaKeyword" maxlength="200" rows="3" class="form-control" placeholder="" [(ngModel)]="Item.MetaKeyword" #newMetaKeyword></textarea>
                          
                        </div>
                      </div>
                    </div>
                    <div class="col-sm-12 col-md-12">
                      <div class="form-group row">
                        <label class="col-md-12 col-form-label" for="MetaDescription">Meta Description(<i>{{newMetaDescription.value.length}}/300</i>)</label>
                        <div class="col-md-12">
                          <textarea id="MetaDescription" name="MetaDescription" maxlength="300" rows="3" class="form-control" placeholder="" [(ngModel)]="Item.MetaDescription" #newMetaDescription></textarea>
                        
                        </div>
                      </div>
                    </div>
                  </div>


                <div class="col-sm-12 col-md-3 siderbar-product" style="margin-top:15px;">

                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="">Đăng danh mục</label>
                      <div class="col-md-12 squaredcheck" style="display:flex; justify-content: space-between; margin-left: -4px; padding: 8px 20px;">
                        <button type="button" class="btn btn-primary" appNoDblClickMat (click)="SaveCateNews()">Lưu thông tin</button>
                        <button type="button" class="btn btn-secondary" (click)="CateNewsModal.hide()">Đóng</button>
                      </div>
                    </div>
                  </div>

                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="">Loại danh mục<span *ngIf="Item.TypeCategoryId==undefined" style="color: red;">&ngsp;(*)</span></label>
                      <div class="col-md-12" style="padding: 20px; margin-left: -10px;">
                        <ng-select [items]="typeCategoryNews"
                                   bindLabel="Name"
                                   bindValue="Id"
                                   placeholder="Chọn loại danh mục"
                                   [(ngModel)]="Item.TypeCategoryId"
                                   [ngModelOptions]="{standalone: true}">
                        </ng-select>
                      </div>
                    </div>
                  </div>

                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row" [hidden]="listLanguage.length == 1">
                      <label class="col-md-12 col-form-label" for="">Ngôn ngữ<span *ngIf="Item.LanguageId==undefined" style="color: red;">&ngsp;(*)</span></label>
                      <div class="col-md-12">
                        <ng-select [items]="listLanguage"
                                   bindLabel="Name"
                                   bindValue="LanguageId"
                                   placeholder="Chọn ngôn ngữ"
                                   [(ngModel)]="Item.LanguageId"
                                   [ngModelOptions]="{standalone: true}">
                        </ng-select>
                      </div>
                    </div>
                  </div>

                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="">Danh mục cha</label>
                      <div class="col-md-12" style="padding: 20px; margin-left: -10px;">
                        <ng-select [items]="listCateParent"
                                   bindLabel="Name"
                                   bindValue="CategoryId"
                                   placeholder="Chọn danh mục"
                                   [disabled]="!Item.CategoryId && Item.CategoryParentId"
                                   [(ngModel)]="Item.CategoryParentId"
                                   [ngModelOptions]="{standalone: true}">
                          <ng-template ng-label-tmp let-item="item">
                            <span>{{item.Name}}</span>
                          </ng-template>
                          <ng-template ng-option-tmp let-item="item" let-index="index">
                            <span [innerHTML]="item.Space"></span><span>{{item.Name}}</span>
                          </ng-template>
                        </ng-select>
                      </div>
                    </div>
                  </div>

                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row" [hidden]="true">
                      <label class="col-md-12 col-form-label" for="Icon">Icon</label>
                      <div class="col-md-12">
                        <div class="circlecheck">
                          <input type="radio" id="f-option" class="circle-1" name="selector" [value]='true' [(ngModel)]="Item.IconText" [ngModelOptions]="{standalone: true}">
                          <label for="f-option">Nhập tên</label>
                          <div class="outer-circle"></div>
                        </div>
                        <div class="col-md-12">
                          <input type="text" id="Icon" name="Icon" class="form-control" placeholder="Icon" [(ngModel)]="Item.IconFa" [disabled]="Item.IconText==false || Item.IconText==undefined" autocomplete="off">
                        </div>
                      </div>
                      <div class="col-md-12">
                        <div class="circlecheck">
                          <input type="radio" id="g-option" class="circle-2" name="selector" [value]='false' [(ngModel)]="Item.IconText" [ngModelOptions]="{standalone: true}">
                          <label for="g-option">Up ảnh</label>
                          <div class="outer-circle"></div>
                        </div>
                        <div class="col-md-12">
                          <input #fileIcon id="IconImage" name="IconImage" type="file" (change)="upload(fileIcon.files, 4)" [disabled]="Item.IconText==true || Item.IconText==undefined" />
                          <span style="font-weight:bold;color:green;" *ngIf="progressIcon > 0 && progressIcon < 100">
                            {{progressIcon}}%
                          </span>
                          <span style="font-weight:bold;color:green;">
                            <img class="image-upload" *ngIf="Item.CategoryId == undefined && Item.IconText == false && messageIcon" src="{{ domainImage }}{{ messageIcon }}" />
                            <img class="image-upload" *ngIf="Item.CategoryId != undefined && Item.IconText == false && Item.Icon != undefined" src="{{ domainImage }}{{ Item.Icon }}" />
                          </span>
                          <i class="fa fa-trash icon-remove-image" style="right: 131px;" (click)="RemoveImage(4)" *ngIf="(Item.CategoryId == undefined && messageIcon && Item.IconText == false) || (Item.CategoryId != undefined && Item.Icon != undefined && Item.IconText == false)"></i>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="Image">Ảnh danh mục</label>
                      <div class="col-md-12" style="padding:20px">
                        <input #file id="Image" name="Image" type="file" (change)="upload(file.files, 5)" />
                        <span style="font-weight:bold;color:green;" *ngIf="progress > 0 && progress < 100">
                          {{progress}}%
                        </span>
                        <span style="font-weight:bold;color:green;">
                          <img class="image-upload" *ngIf="Item.CategoryId == undefined && message" src="{{ domainImage }}{{ message }}" />
                          <img class="image-upload" *ngIf="Item.CategoryId != undefined && Item.Image != undefined" src="{{ domainImage }}{{ Item.Image }}" />
                        </span>
                        <i class="fa fa-trash icon-remove-image" (click)="RemoveImage(5)" *ngIf="(Item.CategoryId == undefined && message) || (Item.CategoryId != undefined && Item.Image != undefined)"></i>
                      </div>
                    </div>

                  </div>
                  <div class="col-sm-12 col-md-12">
                    <div class="form-group row">
                      <label class="col-md-12 col-form-label" for="Location">Thứ tự hiển thị</label>
                      <div class="col-md-12" style="padding:20px">
                        <input type="number" id="Location" name="Location" class="form-control" min="1" placeholder="" [(ngModel)]="Item.Location" onkeypress="return event.charCode >= 48 && event.charCode <= 57" autocomplete="off">
                      </div>
                    </div>
                    </div>

                  </div>
                </div>
              </div>
              </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" appNoDblClickMat (click)="SaveCateNews()">Lưu thông tin</button>
          <button type="button" class="btn btn-secondary" (click)="CateNewsModal.hide()">Đóng</button>
        </div>
      </div>
    </form>
  </div>
</div>
<!--popup sắp xếp tin danh mục-->
<div bsModal #SortNewsModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <form class="login-form">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Sắp xếp tin</h4>
          <button type="button" class="close" (click)="SortNewsModal.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="form-group row" style="width:100%; margin-left:0px;margin-top:15px;margin-bottom:15px">
          <div class="col-md-12">
            <ngx-sortable [items]="listOrderByCat" [listStyle]="{width: '100%', height: '300px'}">
              <ng-template let-item>
                <div style="height: 30px; padding-left: 20px; padding-top: 3px; position: relative;" class="sortable-list-item" *ngIf="item.Status!=99">
                  {{item.Title}}
                </div>
              </ng-template>
            </ngx-sortable>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" appNoDblClickMat (click)="SaveSortNews()">Lưu thông tin</button>
          <button type="button" class="btn btn-secondary" (click)="SortNewsModal.hide()">Đóng</button>
        </div>
      </div>
    </form>
  </div>
</div>
