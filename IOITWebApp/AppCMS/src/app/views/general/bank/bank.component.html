<div class="container-fluid">
  <div class="row" style="margin-bottom: 20px;">
    <div class="col-sm-12 col-md-6 mb-2" *ngIf="role == 1">
      <ng-select [items]="listCompany"
                 bindLabel="Name"
                 bindValue="CompanyId"
                 [multiple]="false"
                 placeholder="Chọn công ty"
                 [(ngModel)]="companyselectsearch"
                 [ngModelOptions]="{standalone: true}" (change)="CompanyChanged()" style="margin-right: 15px;min-width: 150px;">
      </ng-select>
    </div>
    <div class="col-sm-12 col-md-6 mb-2">
      <ng-select [items]="listBranch"
                 bindLabel="Name"
                 bindValue="PMQLXe"
                 [multiple]="false"
                 placeholder="Chọn trạm trộn"
                 [(ngModel)]="PMQLXe"
                 [ngModelOptions]="{standalone: true}" (change)="QueryChanged()" style="margin-right: 15px;min-width: 150px;">
      </ng-select>
    </div>
  </div>
</div>
<div *ngIf="PMQLXe != '' && PMQLXe != undefined">
  <!--<iframe width="100%" height="900px" frameBorder="0" [src]="urlSafe"></iframe>-->
  <!--<a href="{{ urlSafe }}" target="_blank"></a>-->
</div>
<div *ngIf="PMQLXe == '' || PMQLXe == undefined">
  <h1 style="text-align:center; margin:auto">Không có link !</h1>
</div>
